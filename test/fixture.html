<!doctype html><html lang="en" class="light" data-accent="iris"><head><meta charset="utf-8"><title>Meetings in Buzz</title><link rel="stylesheet" href="./host/buzz.css"><style>
@font-face{font-family:"Inter Variable";src:url("./host/inter.woff2") format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
html{font-family:var(--font-sans);font-size:16px}body{margin:0;background:var(--bg-app);color:var(--text-standard)}.fixture-topbar{display:flex;align-items:center;gap:var(--space-6);height:var(--size-topbar);padding-inline:var(--space-panel-inset)}.fixture-brand{margin-inline-end:auto}.fixture-layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:var(--space-panel-gap);height:calc(100vh - var(--size-topbar));padding:0 var(--space-workspace-inset) var(--space-workspace-inset)}.fixture-main{background:var(--surface-panel);border-radius:var(--radius-panel);min-height:0;overflow:hidden}.fixture-settings{max-width:48rem;margin:auto;padding:var(--space-panel-inset)}.fixture-chat{display:flex;flex-direction:column;height:100%;min-height:0}.fixture-chat-history{flex:1;padding:var(--space-4);overflow:auto}.fixture-chat form{padding:var(--space-4)}.fixture-chat input{width:100%}audio{display:none}@media(max-width:650px){.fixture-layout{grid-template-columns:180px minmax(0,1fr)}}
.fixture-canvas{display:flex;flex-direction:column;gap:var(--space-4);padding:var(--space-panel-inset);overflow:auto}.fixture-canvas label{display:flex;flex:1;flex-direction:column;gap:var(--space-2);min-height:0}.fixture-canvas textarea{flex:1;min-height:14rem;resize:vertical}.fixture-canvas-actions{display:flex;gap:var(--space-2);flex-wrap:wrap}</style></head><body><main id="app"></main><script>if(new URLSearchParams(location.search).has('dark'))document.documentElement.className='dark'</script><script type="module" src="./fixture.js"></script></body></html>
