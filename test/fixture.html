<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Meetings fixture</title><style>
:root{color-scheme:dark;--surface-panel:#20232b;--interaction-fill:#333843;--text-standard:#eeeef2;--text-secondary:#b1b4bf;--border-standard:#424754;--status-online:#61c99b;font-family:system-ui}body{margin:0;background:#17191f;color:#eeeef2}button,input,select{font:inherit}button{cursor:pointer}.buzz-button{border:1px solid #505664;border-radius:7px;background:#333843;color:inherit;padding:8px 12px}.buzz-button-label{display:flex;gap:8px;align-items:center}.buzz-button[data-variant=destructive]{background:#a83243;border-color:#a83243}button:disabled{opacity:.45}.fixture-topbar{display:flex;justify-content:space-between;padding:8px 16px;border-bottom:1px solid #424754}.fixture-layout{display:grid;grid-template-columns:250px minmax(0,1fr);height:calc(100vh - 60px)}.meeting-sidebar{border-right:1px solid #424754}audio{display:none}@media(max-width:650px){.fixture-layout{grid-template-columns:200px minmax(0,1fr)}}
</style></head><body><main id="app"></main><script type="module" src="./fixture.js"></script></body></html>
