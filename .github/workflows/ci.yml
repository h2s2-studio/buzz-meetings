name: Test

on:
  push:
    branches: [main, "release/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.project }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            runner: ubuntu-24.04
            browser-install: --with-deps chromium
          # Test WebKit's media stack on the OS used by the Buzz macOS webview.
          - project: webkit
            runner: macos-15-intel
            browser-install: chromium webkit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:build
      - run: npm test
      - if: runner.os == 'Linux'
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          cargo +1.98.1 fmt --all --check
          cargo +1.98.1 test --locked --workspace
          cargo +1.98.1 build --locked
      - if: runner.os == 'Linux'
        name: Download verified LiveKit test server
        run: |
          archive=livekit_1.13.11_linux_amd64.tar.gz
          curl -fsSL "https://github.com/livekit/livekit/releases/download/v1.13.11/$archive" -o "$RUNNER_TEMP/$archive"
          echo "1e9ee90ca301e1842b2887fc77cb122759756a9c8aeb4334ee91de3325ec43fb  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" livekit-server
      - if: runner.os == 'Linux'
        name: Validate deployment configuration
        env:
          LIVEKIT_URL: wss://meetings.example.org
          LIVEKIT_NODE_IP: 192.0.2.10
          LIVEKIT_API_KEY: example-test-key
          LIVEKIT_API_SECRET: example-test-lk-secret
          MEETING_ACCESS_KEY: example-test-creation-key
        run: docker compose -f deploy/compose.yaml config --quiet
      - if: runner.os == 'Linux'
        name: Validate private speech worker
        run: |
          python3 -m venv "$RUNNER_TEMP/speech-env"
          "$RUNNER_TEMP/speech-env/bin/python" -m pip install -r services/transcriber/requirements.txt
          "$RUNNER_TEMP/speech-env/bin/python" -m unittest discover -s services/transcriber -p 'test_*.py'
          docker compose -f deploy/compose.yaml --profile speech config --quiet
        env:
          LIVEKIT_URL: wss://meetings.example.org
          LIVEKIT_NODE_IP: 192.0.2.10
          LIVEKIT_API_KEY: example-test-key
          LIVEKIT_API_SECRET: example-test-lk-secret
          MEETING_ACCESS_KEY: example-test-creation-key
          MEETING_TRANSCRIBER_URL: http://127.0.0.1:8092/transcribe
      - run: npx playwright install ${{ matrix.browser-install }}
      - if: runner.os == 'Linux'
        run: LIVEKIT_SERVER_BIN="$RUNNER_TEMP/livekit-server" npm run test:media -- --project=chromium
      - if: runner.os == 'macOS'
        run: npm run test:browser -- --project=webkit
