name: Test
on:
  push:
    branches: [main, "release/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            browser: chromium
            install: --with-deps chromium
          - os: macos-15
            browser: webkit
            install: webkit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:build
      - run: npm test
      - run: npx playwright install ${{ matrix.install }}
      - run: npm run test:browser -- --project=${{ matrix.browser }}
